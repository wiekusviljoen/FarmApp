<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2f6b3f"><title>FarmFlow Offline</title>
<style>body{font-family:system-ui,sans-serif;background:#f4f1e8;margin:0;color:#26352a}.wrap{max-width:720px;margin:auto;padding:24px}.card{background:white;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #0001}label{display:block;margin-top:10px;font-weight:600}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccd5cb;border-radius:9px;margin-top:5px}button{margin-top:14px;padding:11px 16px;border:0;border-radius:9px;background:#2f6b3f;color:white;font-weight:700}.muted{color:#68756c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head>
<body><div class="wrap"><h1>🌿 FarmFlow Offline</h1><p class="muted">No internet connection. You can still record farm work on this phone. Entries will sync when you reconnect and are signed in.</p><p id="offlineQueueStatus">Checking…</p><div id="offlineNotice" class="card"></div>
<div class="card"><h2>Log livestock event</h2><form id="offlineEvent"><label>Animal tag / ID<input name="tagNumber" required></label><div class="grid"><div><label>Event<select name="eventType"><option>Birth</option><option>Purchase</option><option>Sale</option><option>Death</option><option>Movement</option><option>Treatment</option><option>Vaccination</option><option>Other</option></select></label></div><div><label>Date<input name="eventDate" type="date" required></label></div></div><label>Amount (NAD)<input name="amount" type="number" min="0" step="0.01"></label><label>Notes<textarea name="notes" rows="3"></textarea></label><button>Save event offline</button></form></div>
<div class="card"><h2>Add animal</h2><div class="grid"><div><label>Tag / ID<input id="animalTag" required></label></div><div><label>Species<select id="animalSpecies"><option>Sheep</option><option>Cattle</option><option>Goat</option><option>Other</option></select></label></div></div><div class="grid"><div><label>Breed<input id="animalBreed"></label></div><div><label>Sex<input id="animalSex"></label></div></div><div class="grid"><div><label>Date of birth<input id="animalDob" type="date"></label></div><div><label>Camp<input id="animalCamp"></label></div></div><label>Status<select id="animalStatus"><option>Active</option><option>Sold</option><option>Deceased</option><option>Transferred</option></select></label><label>Purchase price (NAD)<input id="animalPrice" type="number" min="0" step="0.01"></label><label>Notes<textarea id="animalNotes" rows="3"></textarea></label><button id="saveAnimal">Save animal offline</button></div>
<div class="card"><h2>Rain register</h2><form id="offlineRain"><div class="grid"><div><label>Date<input name="date" type="date" required></label></div><div><label>Millimetres<input name="millimeters" type="number" min="0" max="2000" step="0.1" required></label></div></div><label>Camp<input name="camp"></label><label>Notes<textarea name="notes" rows="2"></textarea></label><button>Save rainfall offline</button></form></div>
</div><script src="/js/offline.js"></script><script>
document.getElementById("offlineEvent").addEventListener("submit",e=>{e.preventDefault();FarmFlowOffline.queue("livestock-event",Object.fromEntries(new FormData(e.target))).then(()=>e.target.reset())});
document.getElementById("offlineRain").addEventListener("submit",e=>{e.preventDefault();FarmFlowOffline.queue("rainfall",Object.fromEntries(new FormData(e.target))).then(()=>e.target.reset())});
document.getElementById("saveAnimal").addEventListener("click",()=>FarmFlowOffline.queue("create-animal",{tagNumber:animalTag.value,species:animalSpecies.value,breed:animalBreed.value,sex:animalSex.value,dateOfBirth:animalDob.value,camp:animalCamp.value,status:animalStatus.value,purchasePrice:animalPrice.value,notes:animalNotes.value}).then(()=>{animalTag.value="";animalBreed.value="";animalSex.value="";animalDob.value="";animalCamp.value="";animalPrice.value="";animalNotes.value="";}));
</script></body></html>
